name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  publicaciones:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/publicaciones-crea/skills/publicaciones-crea
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e "motor[test]"
      - run: python -m pytest -q
        env:
          CREA_PRUEBA_INSTALACION: '1'
