[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crea-publicaciones"
version = "1.3.0"
description = "Motor de la skill publicaciones-crea: genera piezas de Instagram con el estilo CREA."
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["crea_publicaciones"]

[tool.setuptools.package-data]
crea_publicaciones = ["recursos/**/*"]
